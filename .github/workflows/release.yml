name: Publish application package
on:
  push:
    tags: ['v0.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/build-app-release.mjs
      - name: Publish verified build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" .private/github-release/gale-control.tar.gz .private/github-release/SHA256SUMS --verify-tag --title "Gale Control $GITHUB_REF_NAME" --generate-notes
